spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/tcg
    username: tcg
    password: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  config:
    import: optional:file:../../infra/.env[.properties]