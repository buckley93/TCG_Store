services:
  postgres:
    image: postgres:16
    container_name: tcg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tcg
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg_store
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg -d tcg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: